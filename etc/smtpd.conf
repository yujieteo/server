pki teoyujie.org cert "/etc/ssl/teoyujie.org.fullchain.pem"
pki teoyujie.org key "/etc/ssl/private/teoyujie.org.key"
include "/etc/mail/srs.conf"

table aliases file:/etc/mail/aliases
table virtuals file:/etc/mail/virtual

filter "rdns" phase connect match !rdns disconnect "550 no reverse DNS"
filter "dkimsign" proc-exec "filter-dkimsign -d teoyujie.org -s @DKIM_SELECTOR@ -k /etc/mail/dkim/teoyujie.org.@DKIM_SELECTOR@.rsa.key" user _dkimsign group _dkimsign

listen on socket filter "dkimsign"
listen on lo0 filter "dkimsign"
listen on egress tls pki teoyujie.org tag internet filter "rdns"
listen on 10.8.0.1 tag vpn

action "local" forward-only alias <aliases>
action "forward" forward-only virtual <virtuals>
action "outbound" relay srs

match from any tag internet for domain "teoyujie.org" rcpt-to <virtuals> action "forward"
match from any tag internet for domain "teoyujie.org" reject
match from src 10.8.0.0/24 tag vpn for local action "local"
match from src 10.8.0.0/24 tag vpn for any reject
match from local for local action "local"
match from local for any action "outbound"
