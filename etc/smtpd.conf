# teoyujie.org mail: forward only. There are no mailboxes on this server. Check: smtpd -n
# /etc/mail/aliases maps each address to contact, and contact to the real mailbox.
# install.sh makes /etc/mail/srs.conf with a random SRS key. It is not in Git.

pki teoyujie.org cert "/etc/ssl/teoyujie.org.fullchain.pem"
pki teoyujie.org key "/etc/ssl/private/teoyujie.org.key"
include "/etc/mail/srs.conf"

table aliases file:/etc/mail/aliases

listen on socket
listen on lo0
listen on egress tls pki teoyujie.org

action "forward" forward-only alias <aliases>
action "outbound" relay srs

match from any for domain "teoyujie.org" action "forward"
match from local for local action "forward"
match from local for any action "outbound"
