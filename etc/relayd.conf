# relayd ends TLS on port 443 for every name of this server. httpd serves the
# site on loopback. Lattice runs on the desktop, behind the VPN, and its gateway
# takes connections from this server only (dotfiles: machines/desktop-lattice.nix).
table <site> { 127.0.0.1 }
table <lattice> { 10.8.0.4 }

http protocol "https" {
	# TLS 1.3 only: in TLS 1.2, LibreSSL signs the key exchange with SHA-1 on request and has no Extended Master Secret.
	tls { no tlsv1.2 }
	# The first keypair is the default. Its certificate also names www and mta-sts. Web and mail share its key.
	tls keypair "teoyujie.org" cert "/etc/ssl/teoyujie.org.fullchain.pem"
	tls keypair "teoyujie.org" key "/etc/ssl/private/teoyujie.org.key"
	# Lattice has a certificate of its own, so a failed renewal of it touches nothing else.
	tls keypair "lattice.teoyujie.org" cert "/etc/ssl/lattice.teoyujie.org.fullchain.pem"
	tls keypair "lattice.teoyujie.org" key "/etc/ssl/private/lattice.teoyujie.org.key"
	# httpd logs this address (log style forwarded). A client's own value is replaced.
	match request header set "X-Forwarded-For" value "$REMOTE_ADDR"
	pass
	pass request quick header "Host" value "lattice.teoyujie.org" forward to <lattice>
	# The Lattice editor talks over a WebSocket.
	http websockets
}

relay "https" {
	listen on egress port 443 tls
	protocol "https"
	# An open editor can be quiet for a long time.
	session timeout 3600
	forward to <site> port 8080
	forward to <lattice> port 18490
}
