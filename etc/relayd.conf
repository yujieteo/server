# The private front door of Lavish and femahoy, on the VPN address only. Check: relayd -n
# unbound gives mac.lavish.teoyujie.org, desk.lavish.teoyujie.org and fh.teoyujie.org to the VPN
# devices as 10.8.0.1. The Mac and the desktop open reverse tunnels to 10.8.0.1 (sshd_config):
# Lavish on the Mac to port 4387, Lavish on the desktop to port 4388, femahoy to port 8790.
# screen.teoyujie.org goes to noVNC on the desktop, 10.8.0.4 port 6080, directly through wg0.
# A request passes only if it has no Origin header, or if Origin is https:// and the same name.
# relayd gives 403 to each other Origin and to Sec-Fetch-Site cross-site, before it changes a header.
# Then relayd sets Host and Origin to the local address, because each app accepts only that address.
# relayd does not change the headers to noVNC.
# Lavish listens on 127.0.0.1:4387 on the Mac and on the desktop.
# For femahoy, relayd also sends the token of fh serve, so the bare name works.
# install.sh puts in the token from local.conf. This file has mode 600.

table <mac> { 10.8.0.1 }
table <desk> { 10.8.0.1 }
table <fh> { 10.8.0.1 }
table <screen> { 10.8.0.4 }

http protocol "private" {
	tls keypair "apps"
	http websockets
	block request
	match request tag "none"
	match request header "Origin" value "*" tag "foreign"
	match request header "Origin" value "https://mac.lavish.teoyujie.org" tag "origin-mac"
	match request header "Origin" value "https://desk.lavish.teoyujie.org" tag "origin-desk"
	match request header "Origin" value "https://fh.teoyujie.org" tag "origin-fh"
	match request header "Origin" value "https://screen.teoyujie.org" tag "origin-screen"
	block quick request tagged "foreign"
	block quick request header "Sec-Fetch-Site" value "cross-site"
	match request header "Host" value "mac.lavish.teoyujie.org" tagged "none" tag "mac"
	match request header "Host" value "mac.lavish.teoyujie.org" tagged "origin-mac" tag "mac"
	match request header "Host" value "desk.lavish.teoyujie.org" tagged "none" tag "desk"
	match request header "Host" value "desk.lavish.teoyujie.org" tagged "origin-desk" tag "desk"
	match request header "Host" value "fh.teoyujie.org" tagged "none" tag "fh"
	match request header "Host" value "fh.teoyujie.org" tagged "origin-fh" tag "fh"
	match request header "Host" value "screen.teoyujie.org" tagged "none" tag "screen"
	match request header "Host" value "screen.teoyujie.org" tagged "origin-screen" tag "screen"
	pass request tagged "mac" forward to <mac>
	pass request tagged "desk" forward to <desk>
	pass request tagged "fh" forward to <fh>
	pass request tagged "screen" forward to <screen>
	match request tagged "mac" header set "Host" value "127.0.0.1:4387"
	match request tagged "mac" header set "Origin" value "http://127.0.0.1:4387"
	match request tagged "desk" header set "Host" value "127.0.0.1:4387"
	match request tagged "desk" header set "Origin" value "http://127.0.0.1:4387"
	match request tagged "fh" header set "Host" value "127.0.0.1:8790"
	match request tagged "fh" header set "Origin" value "http://127.0.0.1:8790"
	match request tagged "fh" header set "Authorization" value "Bearer @FH_TOKEN@"
}

relay "private" {
	listen on 10.8.0.1 port 443 tls
	protocol "private"
	forward to <mac> port 4387
	forward to <desk> port 4388
	forward to <fh> port 8790
	forward to <screen> port 6080
}
