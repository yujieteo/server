# teoyujie.org packet filter. Check: pfctl -nf /etc/pf.conf
# Open from the internet: SSH, web, mail and WireGuard. Everything on wg0 is open.

set skip on lo
block return
pass out

pass in on egress proto tcp to port { ssh smtp http https }
pass in on egress proto udp to port 51820
pass in on egress inet proto icmp icmp-type { echoreq unreach timex }
pass in on egress inet6 proto icmp6

# VPN: the devices can reach the server and each other.
pass on wg0
