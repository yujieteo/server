set skip on lo
block return
pass out

# A host that opens connections too fast goes in <flood> for a day (cron expires it).
# The block is TCP only, so it can never cut off the VPN.
table <flood> persist
pass in on egress proto tcp to (egress) port { http https } keep state (max-src-conn 100, max-src-conn-rate 100/10, overload <flood> flush global)
pass in on egress proto tcp to (egress) port smtp keep state (max-src-conn 20, max-src-conn-rate 30/60, overload <flood> flush global)
block in quick on egress proto tcp from <flood>
pass in on egress proto udp to (egress) port 51820
pass in on egress inet proto icmp icmp-type unreach
pass in on egress inet6 proto icmp6

pass on wg0
