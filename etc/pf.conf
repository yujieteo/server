# teoyujie.org packet filter. Check: pfctl -nf /etc/pf.conf
# Open from the internet: SSH, web, mail and WireGuard, only on the public addresses (egress).
# Thus the VPN address 10.8.0.1 (relayd, the tunnels) is closed from the internet. All of wg0 is open,
# but for noVNC on the desktop (below).

set skip on lo
block return
pass out

pass in on egress proto tcp to (egress) port { ssh smtp http https }
pass in on egress proto udp to (egress) port 51820
pass in on egress inet proto icmp icmp-type unreach
pass in on egress inet6 proto icmp6

# VPN: the devices can reach the server and each other.
pass on wg0
# noVNC on the desktop (10.8.0.4 port 6080): only relayd on the server gets to it (relayd.conf).
block in on wg0 proto tcp to 10.8.0.4 port 6080
