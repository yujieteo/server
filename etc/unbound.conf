# DNS resolver for the server and the VPN devices, with an ad and tracker blocklist.
# Check: unbound-checkconf
server:
	interface: 127.0.0.1
	interface: 10.8.0.1
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	access-control: 10.8.0.0/24 allow
	hide-identity: yes
	hide-version: yes
	auto-trust-anchor-file: "/var/unbound/db/root.key"
	val-log-level: 2
	aggressive-nsec: yes
	# blocklist-update makes this file each week.
	include: "/var/unbound/etc/blocklist.conf"

remote-control:
	control-enable: yes
	control-interface: /var/run/unbound.sock
