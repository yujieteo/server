# DNS resolver for the server and the VPN devices, with an ad and tracker blocklist.
# Check: unbound-checkconf
server:
	interface: 127.0.0.1
	interface: 10.8.0.1
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	access-control: 10.8.0.0/24 allow
	hide-identity: yes
	hide-version: yes
	auto-trust-anchor-file: "/var/unbound/db/root.key"
	val-log-level: 2
	aggressive-nsec: yes
	# The private names of Lavish, femahoy and the fleet view (relayd.conf), for the VPN devices only. "static"
	# gives no other record, so a device does not use a public AAAA record.
	local-zone: "mac.lavish.teoyujie.org." static
	local-data: "mac.lavish.teoyujie.org. A 10.8.0.1"
	local-zone: "desk.lavish.teoyujie.org." static
	local-data: "desk.lavish.teoyujie.org. A 10.8.0.1"
	local-zone: "fh.teoyujie.org." static
	local-data: "fh.teoyujie.org. A 10.8.0.1"
	local-zone: "fleet.teoyujie.org." static
	local-data: "fleet.teoyujie.org. A 10.8.0.1"
	# blocklist-update makes this file each week.
	include: "/var/unbound/etc/blocklist.conf"

remote-control:
	control-enable: yes
	control-interface: /var/run/unbound.sock
