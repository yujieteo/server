# teoyujie.org web server. Check: httpd -n
# httpd runs in a chroot at /var/www, so "/htdocs/site" is /var/www/htdocs/site.

types {
	include "/usr/share/misc/mime.types"
}

# httpd listens on the public addresses (egress) and on 127.0.0.1, but not on the VPN address
# 10.8.0.1: there, relayd has port 443 (relayd.conf).

# Port 80: Let's Encrypt challenges, and a redirect to HTTPS for all other requests.
server "teoyujie.org" {
	listen on egress port 80
	listen on 127.0.0.1 port 80
	alias "www.teoyujie.org"
	alias "mta-sts.teoyujie.org"
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location * {
		block return 301 "https://teoyujie.org$REQUEST_URI"
	}
}

# The site. Each app and the file links have their own folders, so that each deploy
# replaces only its own folder.
server "teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	root "/web/site"
	# Error pages (403, 404 and the others) in the look of the site: www/errdocs/err.html.
	# httpd puts in the code and the message.
	errdocs "/htdocs/server/errdocs"
	location "/f/*" { root "/files" }
	# security.txt, the GPG key and WKD, from www/ in the server repo.
	location "/.well-known/*" { root "/htdocs/server" }
	location "/contact.gpg" { root "/htdocs/server" }
	# The pond services (pond/ in the server repo). Each request runs 1 program.
	# httpd uses the first location that matches, so the read paths come first.
	location "/pond/entries.json" {
		fastcgi
		root "/cgi-bin/pond_read"
	}
	location "/log/" {
		fastcgi
		root "/cgi-bin/pond_read"
	}
	location "/log/feed.xml" {
		fastcgi
		root "/cgi-bin/pond_read"
	}
	location "/pond/*" {
		fastcgi
		root "/cgi-bin/pond_save"
	}
	# The room relay of the neuron explorer (room/ in the server repo), a daemon on 127.0.0.1.
	location "/play/neurons/room" { fastcgi socket tcp 127.0.0.1 8790 }
}

server "www.teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	block return 301 "https://teoyujie.org$REQUEST_URI"
}

# MTA-STS policy for senders of mail to teoyujie.org.
server "mta-sts.teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	root "/htdocs/server"
}

# The private names of Lavish and femahoy (relayd.conf). On the public addresses, only the
# Let's Encrypt challenges: all other requests get no answer.
server "mac.lavish.teoyujie.org" {
	listen on egress port 80
	alias "desk.lavish.teoyujie.org"
	alias "fh.teoyujie.org"
	alias "screen.teoyujie.org"
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location * { block drop }
}

server "mac.lavish.teoyujie.org" {
	listen on egress tls port 443
	alias "desk.lavish.teoyujie.org"
	alias "fh.teoyujie.org"
	alias "screen.teoyujie.org"
	tls {
		certificate "/etc/ssl/apps.crt"
		key "/etc/ssl/private/apps.key"
	}
	block drop
}

# On the VPN address, port 80 sends the private names to HTTPS (relayd).
server "mac.lavish.teoyujie.org" {
	listen on 10.8.0.1 port 80
	alias "desk.lavish.teoyujie.org"
	alias "fh.teoyujie.org"
	alias "screen.teoyujie.org"
	block return 301 "https://$HTTP_HOST$REQUEST_URI"
}
