no banner

types {
	include "/usr/share/misc/mime.types"
	application/wasm wasm
}

server "teoyujie.org" {
	listen on egress port 80
	listen on 127.0.0.1 port 80
	alias "www.teoyujie.org"
	alias "mta-sts.teoyujie.org"
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location * {
		block return 301 "https://teoyujie.org$REQUEST_URI"
	}
}

server "teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	root "/web/site"
	gzip-static
	hsts
	header set "X-Content-Type-Options" "nosniff" always
	header set "Referrer-Policy" "strict-origin-when-cross-origin" always
	header set "Content-Security-Policy" "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always
	errdocs "/htdocs/server/errdocs"
	location "/f/*" { root "/files" }
	location "/.well-known/*" { root "/htdocs/server" }
	location "/contact.gpg" { root "/htdocs/server" }
	location "/feed.xml" { root "/web/feed" }
	location "/reading.html" { root "/web/feed" }
	location "/forecasters.html" { root "/web/feed" }
	location "/forecasters.xml" { root "/web/feed" }
	location "/edmw.xml" { root "/web/feed" }
}

server "www.teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	block return 301 "https://teoyujie.org$REQUEST_URI"
}

server "mta-sts.teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	root "/htdocs/server"
}
