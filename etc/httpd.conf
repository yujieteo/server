no banner

types {
	include "/usr/share/misc/mime.types"
}

# These pages show text from other sites, so they may run no script at all.
# The value holds its own quotes, because httpd reads a macro again as config text.
no_script="\"default-src 'none'; style-src 'self'; font-src 'self'; img-src data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'\""

server "teoyujie.org" {
	listen on egress port 80
	alias "www.teoyujie.org"
	alias "mta-sts.teoyujie.org"
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location * {
		block return 301 "https://teoyujie.org$REQUEST_URI"
	}
}

server "teoyujie.org" {
	listen on egress tls port 443
	# TLS 1.3 only: in TLS 1.2, LibreSSL signs the key exchange with SHA-1 on request and has no Extended Master Secret.
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
		protocols "tlsv1.3"
	}
	root "/web/site"
	# Error pages in the site's look, built by the site (src/pages.ts). Here, not globally: the other servers have no /style.css.
	errdocs "/web/site/errdocs"
	hsts subdomains
	header set "X-Content-Type-Options" "nosniff" always
	header set "Referrer-Policy" "no-referrer" always
	header set "X-Frame-Options" "SAMEORIGIN" always
	# The site loads nothing from other hosts, and no page has an inline script or style.
	header set "Content-Security-Policy" "default-src 'self'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always
	location "/f/*" {
		root "/files"
		header set "X-Robots-Tag" "noindex, nofollow" always
	}
	location "/fonts/*" { header set "Cache-Control" "max-age=2592000" }
	# httpd's own Cache-Control is no-cache. Agents get five minutes, then ask again: httpd answers If-Modified-Since with 304.
	location "/llms.txt" { header set "Cache-Control" "max-age=300, must-revalidate" }
	location "/robots.txt" { header set "Cache-Control" "max-age=300, must-revalidate" }
	location "/api/*" { header set "Cache-Control" "max-age=300, must-revalidate" }
	location "/notes/*" { header set "Cache-Control" "max-age=300, must-revalidate" }
	location "/.well-known/*" { root "/htdocs/server" }
	location "/contact.gpg" { root "/htdocs/server" }
	location "/health.txt" { root "/status" }
	location "/feed.xml" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
	}
	location "/feeds-manifest.json" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
	}
	location "/reading.html" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
		header set "Content-Security-Policy" $no_script always
	}
	location "/forecasters.html" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
		header set "Content-Security-Policy" $no_script always
	}
	location "/reading.txt" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
	}
	location "/forecasters.xml" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
	}
	location "/forecasters.txt" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
	}
	location "/edmw.xml" { root "/feed" }
	location "/singapore-policy-actionables.html" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
		header set "Content-Security-Policy" $no_script always
	}
	location "/singapore-policy-actionables.xml" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
	}
	location "/singapore-policy-actionables.txt" {
		root "/feed"
		header set "Cache-Control" "max-age=300, must-revalidate"
	}
}

server "www.teoyujie.org" {
	listen on egress tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
		protocols "tlsv1.3"
	}
	block return 301 "https://teoyujie.org$REQUEST_URI"
}

server "mta-sts.teoyujie.org" {
	listen on egress tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
		protocols "tlsv1.3"
	}
	root "/htdocs/server"
}
