no banner

types {
	include "/usr/share/misc/mime.types"
}

# These pages show text from other sites, so they may run no script at all.
# The value holds its own quotes, because httpd reads a macro again as config text.
no_script="\"default-src 'none'; style-src 'self'; font-src 'self'; img-src data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'\""

server "teoyujie.org" {
	listen on egress port 80
	listen on 127.0.0.1 port 80
	alias "www.teoyujie.org"
	alias "mta-sts.teoyujie.org"
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location * {
		block return 301 "https://teoyujie.org$REQUEST_URI"
	}
}

server "teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	root "/web/site"
	gzip-static
	hsts subdomains
	connection request timeout 20
	header set "X-Content-Type-Options" "nosniff" always
	header set "Referrer-Policy" "strict-origin-when-cross-origin" always
	# The site loads nothing from other hosts. Its pages have inline scripts and styles.
	header set "Content-Security-Policy" "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always
	header set "Permissions-Policy" "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always
	header set "Cross-Origin-Opener-Policy" "same-origin" always
	errdocs "/htdocs/server/errdocs"
	location "/f/*" {
		root "/files"
		header set "X-Robots-Tag" "noindex, nofollow" always
	}
	location "/fonts/*" { header set "Cache-Control" "max-age=2592000" }
	location "/.well-known/*" { root "/htdocs/server" }
	location "/contact.gpg" { root "/htdocs/server" }
	location "/feed.xml" { root "/web/feed" }
	location "/reading.html" {
		root "/web/feed"
		header set "Content-Security-Policy" $no_script always
	}
	location "/forecasters.html" {
		root "/web/feed"
		header set "Content-Security-Policy" $no_script always
	}
	location "/reading.txt" { root "/web/feed" }
	location "/forecasters.xml" { root "/web/feed" }
	location "/forecasters.txt" { root "/web/feed" }
	location "/edmw.xml" { root "/web/feed" }
	location "/singapore-policy-actionables.html" {
		root "/web/feed"
		header set "Content-Security-Policy" $no_script always
	}
	location "/singapore-policy-actionables.xml" { root "/web/feed" }
	location "/singapore-policy-actionables.txt" { root "/web/feed" }
}

server "www.teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	block return 301 "https://teoyujie.org$REQUEST_URI"
}

server "mta-sts.teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	root "/htdocs/server"
}
