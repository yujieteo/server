
types {
	include "/usr/share/misc/mime.types"
}


server "teoyujie.org" {
	listen on egress port 80
	listen on 127.0.0.1 port 80
	alias "www.teoyujie.org"
	alias "mta-sts.teoyujie.org"
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location * {
		block return 301 "https://teoyujie.org$REQUEST_URI"
	}
}

server "teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	root "/web/site"
	errdocs "/htdocs/server/errdocs"
	location "/f/*" { root "/files" }
	location "/.well-known/*" { root "/htdocs/server" }
	location "/contact.gpg" { root "/htdocs/server" }
	location "/pond/entries.json" {
		fastcgi
		root "/cgi-bin/pond_read"
	}
	location "/log/" {
		fastcgi
		root "/cgi-bin/pond_read"
	}
	location "/log/feed.xml" {
		fastcgi
		root "/cgi-bin/pond_read"
	}
	location "/pond/*" {
		fastcgi
		root "/cgi-bin/pond_save"
	}
	location "/play/neurons/room" { fastcgi socket tcp 127.0.0.1 8790 }
}

server "www.teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	block return 301 "https://teoyujie.org$REQUEST_URI"
}

server "mta-sts.teoyujie.org" {
	listen on egress tls port 443
	listen on 127.0.0.1 tls port 443
	tls {
		certificate "/etc/ssl/teoyujie.org.fullchain.pem"
		key "/etc/ssl/private/teoyujie.org.key"
	}
	root "/htdocs/server"
}

server "mac.lavish.teoyujie.org" {
	listen on egress port 80
	alias "desk.lavish.teoyujie.org"
	alias "fh.teoyujie.org"
	alias "fleet.teoyujie.org"
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location * { block drop }
}

server "mac.lavish.teoyujie.org" {
	listen on egress tls port 443
	alias "desk.lavish.teoyujie.org"
	alias "fh.teoyujie.org"
	alias "fleet.teoyujie.org"
	tls {
		certificate "/etc/ssl/apps.crt"
		key "/etc/ssl/private/apps.key"
	}
	block drop
}

server "mac.lavish.teoyujie.org" {
	listen on 10.8.0.1 port 80
	alias "desk.lavish.teoyujie.org"
	alias "fh.teoyujie.org"
	alias "fleet.teoyujie.org"
	block return 301 "https://$HTTP_HOST$REQUEST_URI"
}

server "fleet.teoyujie.org" {
	listen on 127.0.0.1 port 8092
	root "/fleet"
	location "/.*" { block return 404 }
}
