authority letsencrypt {
	api url "https://acme-v02.api.letsencrypt.org/directory"
	account key "/etc/acme/letsencrypt-privkey.pem"
}

domain teoyujie.org {
	alternative names { www.teoyujie.org mta-sts.teoyujie.org }
	domain key "/etc/ssl/private/teoyujie.org.key" ecdsa
	domain full chain certificate "/etc/ssl/teoyujie.org.fullchain.pem"
	sign with letsencrypt
}
