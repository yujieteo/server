[extend]
useDefault = true

[[rules]]
id = "wireguard-private-key"
description = "WireGuard private key (hostname.wg0 or a client config)"
regex = '''(?i)(?:wgkey|privatekey)\s*=?\s*([A-Za-z0-9+/]{43}=)'''
secretGroup = 1

[[rules]]
id = "smtpd-srs-key"
description = "OpenSMTPD SRS key (/etc/mail/srs.conf)"
regex = '''srs\s+key\s+(\S{16,})'''
secretGroup = 1

[[allowlists]]
description = "RFC 6455 sample Sec-WebSocket-Key: old commits of the branch fm/server-private-tunnels hold it in test.sh, it is not a secret, history is not rewritten"
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
