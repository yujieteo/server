# Source: etc/relayd.conf at fb0e7dcf61ac64b44317d5d7d2c2217ac70cf1f4
table <mac> { 10.8.0.1 }
table <desk> { 10.8.0.1 }
table <fh> { 10.8.0.1 }
table <fleet> { 127.0.0.1 }

http protocol "private" {
	tls keypair "apps"
	http websockets
	return error style "body{background:#fff;color:#111;margin:0;font:100%/1.5 system-ui,sans-serif}body::before{content:'Yu Jie Teo - Mechanical Engineer';display:block;max-width:40em;margin:0 auto;padding:1.5em 1em 0;font-weight:600}h1{max-width:40em;margin:1em auto;padding:0 1em;font-size:2em;background:none;color:inherit;border:0;text-align:left}#m,#footer{max-width:40em;margin:0 auto;padding:0 1em}hr{display:none}body::after{content:'Email: contact@teoyujie.org';display:block;max-width:40em;margin:3em auto 0;padding:1em;border-top:1px solid #ccc}"
	block request
	match request header "Host" value "mac.lavish.teoyujie.org" tag "mac"
	match request header "Host" value "desk.lavish.teoyujie.org" tag "desk"
	match request header "Host" value "fh.teoyujie.org" tag "fh"
	match request header "Host" value "fleet.teoyujie.org" tag "fleet"
	block request quick header "Sec-Fetch-Site" value "cross-site"
	pass request tagged "mac" forward to <mac>
	block request tagged "mac" header "Origin" value "*"
	pass request tagged "mac" header "Origin" value "https://mac.lavish.teoyujie.org" forward to <mac>
	pass request tagged "desk" forward to <desk>
	block request tagged "desk" header "Origin" value "*"
	pass request tagged "desk" header "Origin" value "https://desk.lavish.teoyujie.org" forward to <desk>
	pass request tagged "fh" forward to <fh>
	block request tagged "fh" header "Origin" value "*"
	pass request tagged "fh" header "Origin" value "https://fh.teoyujie.org" forward to <fh>
	pass request tagged "fleet" forward to <fleet>
	block request tagged "fleet" header "Origin" value "*"
	pass request tagged "fleet" header "Origin" value "https://fleet.teoyujie.org" forward to <fleet>
	match request tagged "mac" header set "Host" value "127.0.0.1:4387"
	match request tagged "mac" header set "Origin" value "http://127.0.0.1:4387"
	match request tagged "desk" header set "Host" value "127.0.0.1:4387"
	match request tagged "desk" header set "Origin" value "http://127.0.0.1:4387"
	match request tagged "fh" header set "Host" value "127.0.0.1:8790"
	match request tagged "fh" header set "Origin" value "http://127.0.0.1:8790"
	match request tagged "fh" header set "Authorization" value "Bearer @FH_TOKEN@"
}

relay "private" {
	listen on 10.8.0.1 port 443 tls
	protocol "private"
	forward to <mac> port 4387
	forward to <desk> port 4388
	forward to <fh> port 8790
	forward to <fleet> port 8092
}
