# Checks of the scripts and configs. They never contact the server,
# deploy or use secrets, because the repository is public.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

# A new push to a pull request makes its older run useless, so that run stops.
# Runs on main are left to finish, so each commit there keeps its result.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # bash with pipefail, so a failure inside a pipeline fails the step.
    shell: bash

jobs:
  check:
    # The owner's self-hosted runner on the NixOS desktop. It is Linux, not OpenBSD,
    # so the checks that need OpenBSD's own tools stay in install.sh on the server.
    runs-on: [self-hosted, desktop]
    # The checks take about a minute. The limit stops a hung job from holding the runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job never pushes, so it keeps no token in the clone.
          persist-credentials: false
      - name: Shell, Perl, sshd and unbound checks
        env:
          # Each job runs as a new user with no home folder, so nix keeps its cache in the job's temporary folder.
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: nix shell nixpkgs#oksh nixpkgs#shellcheck nixpkgs#perl nixpkgs#openssh nixpkgs#unbound nixpkgs#python3 -c bash .github/ci/check
  openbsd:
    # install.sh and test.sh on OpenBSD itself: see .github/ci/openbsd. Manual run only, because it downloads a release and boots QEMU.
    # Only the runner with /dev/kvm has the label kvm (machines/desktop-ci.nix in dotfiles).
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, desktop, kvm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild in an OpenBSD VM, restore the keys, and run test.sh
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          TMPDIR: ${{ runner.temp }}
        run: nix shell nixpkgs#qemu nixpkgs#python3 -c python3 -I .github/ci/openbsd
