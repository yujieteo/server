# 1. gitleaks: no secret in the history.
# 2. rebuild: install.sh on a fresh OpenBSD 8.0 VM, then test.sh.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner -v
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: "8.0"
          # install.sh turns off root login, so do not copy files back.
          copyback: false
          run: |
            cp local.conf.example local.conf
            ssh-keygen -q -t ed25519 -N '' -f /root/deploy
            sed -i "s|^DEPLOY_KEY=.*|DEPLOY_KEY='$(cat /root/deploy.pub)'|" local.conf
            sh install.sh
            sh test.sh /root/deploy
