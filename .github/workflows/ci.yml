name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: desktop
    steps:
      - name: actions/checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 finds no secret in the history
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner -v
      - name: gitleaks 8.30.1 finds a WireGuard key and an SRS key
        run: sh evals/secrets-detect.sh "$PWD/gitleaks"
  gate:
    runs-on: desktop
    steps:
      - name: actions/checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: the runner has xz for the Nix installer and /usr/bin/time for evals/bench.sh, and the log says what else it has
        run: |
          for tool in sudo apt-get xz /usr/bin/time curl tar; do printf '%s: %s\n' "$tool" "$(command -v "$tool" || echo missing)"; done
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq xz-utils time
      - name: cachix/install-nix-action v31.8.4 (single user, no KVM; the desktop runner has no systemd)
        uses: cachix/install-nix-action@0b0e072294b088b73964f1d72dfdac0951439dbd
        with:
          install_options: --no-daemon
          enable_kvm: false
      - name: the gate passes, with the tools pinned in flake.lock
        run: nix develop --command ./gate
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: actions/checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: vmactions/openbsd-vm v1.4.9 runs install.sh on a fresh OpenBSD 8.0 VM, then test.sh; install.sh runs twice with wg0 watched, test.sh runs the checks of the kept requirements, then evals/vm.sh checks the keys, modes and configs; root login is off, so nothing is copied back
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3
        with:
          release: "8.0"
          copyback: false
          run: |
            set -e
            sh evals/vm-isolate.sh
            cp local.conf.example local.conf
            ssh-keygen -q -t ed25519 -N '' -f /root/deploy
            sed -i "s|^DEPLOY_KEY=.*|DEPLOY_KEY='$(cat /root/deploy.pub)'|" local.conf
            sh install.sh
            sh evals/vm.sh snapshot
            sh evals/vm.sh second
            status=0
            sh test.sh /root/deploy > /root/test.log 2>&1 || status=$?
            cat /root/test.log
            [ "$status" -eq 0 ]
            sh evals/vm.sh check
            sh evals/bench.sh vm
            sh evals/vm-retire.sh
            sh evals/vm-live.sh
            sh evals/vm-preview.sh
            sh evals/vm.sh wgchange
            if sh evals/vm-wkd.sh; then echo "wkd: both methods work"; else echo "wkd: known failing, see REQUIREMENTS.md WEB-8"; fi
