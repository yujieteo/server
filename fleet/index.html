<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'">
<title>Fleet</title>
<!-- The fleet view (README.md of the server repo). This page does not change. It shows mac.html
     and desk.html, which the Mac and the desktop upload, and the time of each upload (Last-Modified). -->
<style>
:root { --bg: #fff; --fg: #111; --muted: #666; --line: #ddd; --old: #b00020; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --line: #333; --old: #ff6b7f; } }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
main { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); }
section { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
h2 { margin: 0; padding: 8px 12px; font-size: 16px; border-bottom: 1px solid var(--line); }
.time { font-weight: normal; color: var(--muted); }
.time.old { color: var(--old); font-weight: bold; }
iframe { display: block; width: 100%; height: 75vh; border: 0; background: var(--bg); }
</style>
</head>
<body>
<main>
<section><h2>Mac <span class="time" id="mac-time">no page yet</span></h2><iframe id="mac" sandbox title="Mac"></iframe></section>
<section><h2>Desktop <span class="time" id="desk-time">no page yet</span></h2><iframe id="desk" sandbox title="Desktop"></iframe></section>
</main>
<script>
// A page is old when its last upload is more than OLD minutes ago.
const OLD = 10;
const made = {};
async function load(n) {
	try {
		const r = await fetch(n + ".html", { method: "HEAD", cache: "no-store" });
		if (!r.ok) { made[n] = null; return; }
		const t = Date.parse(r.headers.get("Last-Modified"));
		if (t !== made[n]) document.getElementById(n).src = n + ".html?t=" + t;
		made[n] = t;
	} catch (e) { /* keep the last page; show() marks it old */ }
}
function show(n) {
	const el = document.getElementById(n + "-time");
	const t = made[n];
	if (!t) { el.textContent = "no page yet"; el.className = "time old"; return; }
	const min = Math.floor((Date.now() - t) / 60000);
	const old = min > OLD;
	el.textContent = "made " + new Date(t).toLocaleString() + " (" + min + " min ago)" + (old ? ", OLD" : "");
	el.className = old ? "time old" : "time";
}
async function tick() {
	await Promise.all(["mac", "desk"].map(load));
	["mac", "desk"].forEach(show);
}
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
